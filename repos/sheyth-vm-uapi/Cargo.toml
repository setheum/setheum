[package]
name = "sheyth-vm-uapi"
version = "0.1.0"
authors = ["Setheum Developers"]
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Unified API for SheythVM host functions used by the Sheyth smart contract framework"

[dependencies]
parity-scale-codec = { workspace = true, features = ["derive"] }
scale-info = { workspace = true, features = ["derive"] }
bitflags = { workspace = true }

[features]
default = ["std"]
scale = []
std = ["parity-scale-codec/std", "scale-info/std", "bitflags/std"]
