name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-rust:
    name: Rust Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: mise run check

      - name: Cargo Clippy
        run: mise run clippy

  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: check-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: mise run test:rust

  test-js:
    name: JS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run init

      - name: Run Tests
        run: mise run test:js

  test-sheyth:
    name: Sheyth Tests
    runs-on: ubuntu-latest
    needs: check-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Sheyth Tests
        run: mise run test:sheyth

  test-setbft:
    name: Set-BFT Tests
    runs-on: ubuntu-latest
    needs: check-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Set-BFT Tests
        run: mise run test:setbft

  test-spinit:
    name: Spinit Tests
    runs-on: ubuntu-latest
    needs: check-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Spinit Tests
        run: mise run test:spinit

  test-bridge-rust:
    name: Bridge Rust Tests
    runs-on: ubuntu-latest
    needs: check-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Bridge Rust Tests
        run: mise run test:bridge:rust

  test-bridge-go:
    name: Bridge Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Bridge Go Tests
        run: mise run test:bridge:go

  test-substrate:
    name: Substrate SDK Tests
    runs-on: ubuntu-latest
    needs: check-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Substrate SDK Tests
        run: mise run test:substrate
