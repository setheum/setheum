name: Release
on:
  push:
    tags:
      - 'setheum-node-v*'
      - 'clisee-v*'
      - 'bridge-v*'

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Parse tag
        id: parse
        run: |
          TAG=${{ github.ref_name }}
          if [[ "$TAG" =~ ^setheum-node-v(.+)$ ]]; then
            echo "component=setheum-node" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^clisee-v(.+)$ ]]; then
            echo "component=clisee" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^bridge-v(.+)$ ]]; then
            echo "component=bridge-relayer" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ steps.parse.outputs.component }} v${{ steps.parse.outputs.version }}" \
            --generate-notes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ steps.parse.outputs.component }}.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/setheum/${{ steps.parse.outputs.component }}:${{ steps.parse.outputs.version }}
            ${{ env.REGISTRY }}/setheum/${{ steps.parse.outputs.component }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ steps.parse.outputs.component }} Docker image
          cache-from: type=gha
          cache-to: type=gha,mode=max