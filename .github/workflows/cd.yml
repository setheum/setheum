name: CD
on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io

jobs:
  detect-node:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Detect version bump
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git show HEAD~1:Cargo.toml 2>/dev/null | grep -q "^version = \"$VERSION\""; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  detect-clisee:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Detect version bump
        id: version
        run: |
          VERSION=$(grep '^version = ' repos/setheum/clisee/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git show HEAD~1:repos/setheum/clisee/Cargo.toml 2>/dev/null | grep -q "^version = \"$VERSION\""; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  detect-bridge:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Detect version bump
        id: version
        run: |
          VERSION=$(grep -m1 '^## \[' repos/bridge/bridge-relayer/CHANGELOG.md | sed 's/## \[\(.*\)\].*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git show HEAD~1:repos/bridge/bridge-relayer/CHANGELOG.md 2>/dev/null | grep -q "^## \[$VERSION\]"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish-node:
    needs: detect-node
    if: needs.detect-node.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/setheum-node.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/setheum/setheum-node:v${{ needs.detect-node.outputs.version }}
            ${{ env.REGISTRY }}/setheum/setheum-node:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=setheum-node Docker image
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-clisee:
    needs: detect-clisee
    if: needs.detect-clisee.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/clisee.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/setheum/clisee:v${{ needs.detect-clisee.outputs.version }}
            ${{ env.REGISTRY }}/setheum/clisee:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=clisee Docker image
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-bridge:
    needs: detect-bridge
    if: needs.detect-bridge.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/bridge-relayer.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/setheum/bridge-relayer:v${{ needs.detect-bridge.outputs.version }}
            ${{ env.REGISTRY }}/setheum/bridge-relayer:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=bridge-relayer Docker image
          cache-from: type=gha
          cache-to: type=gha,mode=max