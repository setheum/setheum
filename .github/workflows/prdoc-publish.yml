name: PRDoc Publish

on:
  push:
    branches: [ main, master ]
    paths:
      - 'prdoc/**/*.prdoc'

jobs:
  publish:
    name: Update CHANGELOG
    runs-on: ubuntu-latest
    if: github.repository == 'setheum/setheum'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install changelogger
        run: cargo install changelogger-cli

      - name: Generate CHANGELOG
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            changelogger changelog generate --from "$LATEST_TAG"
          else
            changelogger changelog generate
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG.md from PRDocs [skip ci]" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}
