name: PRDoc

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: write

jobs:
  prdoc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install changelogger
        run: cargo install changelogger-cli

      - name: Generate PRDoc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          if [ ! -f "prdoc/pr_${PR_NUM}.prdoc" ]; then
            changelogger prdoc generate --pr "$PR_NUM" --force
          fi

      - name: Validate
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          changelogger prdoc validate prdoc/pr_${PR_NUM}.prdoc

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add prdoc for PR #${{ github.event.pull_request.number }}"
          file_pattern: "prdoc/*.prdoc"